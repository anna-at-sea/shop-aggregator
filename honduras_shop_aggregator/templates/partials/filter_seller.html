{% load i18n %}

{% if filter.show_seller_filter and filter.form.seller.field.queryset.exists %}

<div class="mb-3">
    <label class="form-label fw-semibold">
        {% translate "Sold by" %}
    </label>
    <div class="filter-checkbox-list">
        {% for checkbox in filter.form.seller %}
            <div class="form-check">
                {{ checkbox.tag }}
                <label
                    class="form-check-label"
                    for="{{ checkbox.id_for_label }}"
                >
                    {{ checkbox.choice_label }}
                </label>
            </div>
        {% endfor %}
    </div>
</div>

{% endif %}
